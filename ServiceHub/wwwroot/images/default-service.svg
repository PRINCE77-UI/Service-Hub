<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />

  <!-- Geometric Decorative Grid Lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Glowing Center Circle -->
  <circle cx="400" cy="220" r="76" fill="#4F46E5" opacity="0.25" filter="url(#glow)" />
  <circle cx="400" cy="220" r="56" fill="#1E293B" stroke="url(#brandGrad)" stroke-width="3" />

  <!-- Service Hub Wrench & Spark Icon -->
  <g fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(376, 196)">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
    <path d="M38 12l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="url(#brandGrad)" stroke="none" />
  </g>

  <!-- Typography -->
  <text x="400" y="325" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">
    Service<tspan fill="url(#brandGrad)">Hub</tspan>
  </text>
  <text x="400" y="360" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="14" fill="#94A3B8" letter-spacing="1">
    VERIFIED LOCAL SERVICE
  </text>

  <!-- Accent Pill -->
  <g transform="translate(330, 390)">
    <rect width="140" height="26" rx="13" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="70" y="17" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="11" fill="#38BDF8">
      Professional Care
    </text>
  </g>
</svg>
